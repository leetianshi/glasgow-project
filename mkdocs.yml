site_name: Glasgow Project

theme: 
  name: material
  logo: assets/logo.png
  favicon: assets/logo1.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
  palette:
    # 浅色
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

    # 深色
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - pymdownx.mark

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Home: index.md
  
  - Courses:
    - AI Law: Courses/AI Law/AI Law.md
    - Copyright Law: Courses/Copyright Law/Copyright Law.md
    - Contemporary IP: Courses/Contemporary IP/Contemporary IP.md
    - Dissertation: Courses/Dissertation/Dissertation.md
  
  - Resources:
    - OSCOLA 4th Edition: Resources/OSCOLA 4th Edition.md
    - Others: Resources/Others.md

  - Deadlines: Deadlines/Deadlines.md

plugins:
  - search
  - glightbox